spring.application.name=Back

# Base de données
spring.datasource.url=jdbc:postgresql://db:5432/DestinationFIPnale
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT

# peut etre généré avec la commande :
# [Convert]::ToBase64String((1..64 | ForEach-Object { [byte](Get-Random -Max 256) }))
jwt.secret=MaCleDeTestSuperSecuriseePourLeDeveloppementLocal12345
jwt.expiration=86400000